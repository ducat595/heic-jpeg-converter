<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>HEIC Converter</title><style>
*{box-sizing:border-box}body{margin:0;background:#081523;color:#e4faff;font:16px system-ui}main{max-width:760px;margin:auto;padding:22px}section{background:#10263a;border:1px solid #245366;border-radius:18px;padding:18px;margin:16px 0}button,.pick{display:inline-block;border:0;border-radius:12px;background:#087b88;color:white;padding:13px;font:inherit;cursor:pointer}button:disabled{opacity:.4}input[type=range]{width:100%;accent-color:#45e7d9}small,p{color:#a7c5d4}img{width:80px;height:80px;object-fit:contain}article{border-top:1px solid #245366;padding:12px 0;overflow-wrap:anywhere}progress{width:100%}a{color:#70f2df}h1{margin-bottom:0}label{display:block}#files{display:none}
</style><main><h1>HEIC Converter</h1><p>HEIC → JPEG · 写真は端末内で処理</p><section id="drop"><label class="pick" for="files">写真・ファイルを選択</label><input id="files" type="file" multiple accept=".heic,.heif,.jpg,.jpeg,image/*"><p>HEIC原本を選ぶには「ファイルを選択」を利用してください。PCではドラッグ＆ドロップも可能です。</p><div id="count">未選択</div></section><section><label>JPEG画質 <output id="q">95</output>%<input id="quality" type="range" min="50" max="100" value="95"></label><label><input id="keep" type="checkbox" checked> Exif・撮影日時・GPSを保持</label><p><button id="go" disabled>JPEGに変換</button> <button id="clear">クリア</button></p><progress id="progress" value="0" max="1"></progress><div id="status" role="status"></div></section><section><button id="zip" disabled>ZIP一括保存</button><div id="results"></div></section><section><small>Safariの共有メニューから「ホーム画面に追加」。HDR・動画・メーカー固有情報は保持できない場合があります。変換結果のExif確認欄をご確認ください。</small></section></main>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script><script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script><script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const $=id=>document.getElementById(id);let files=[],outputs=[],busy=false;
function reset(){for(const o of outputs)URL.revokeObjectURL(o.url);outputs=[];$('results').replaceChildren();$('zip').disabled=true;$('progress').value=0}
function choose(list){if(busy)return;reset();files=[...list].filter(f=>/\.(heic|heif|jpe?g)$/i.test(f.name)||/image\/(heic|heif|jpeg)/i.test(f.type));$('count').textContent=files.length+'枚 選択済み';$('go').disabled=!files.length}
$('files').onchange=e=>choose(e.target.files);$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();choose(e.dataTransfer.files)};$('quality').oninput=e=>$('q').value=e.target.value;$('clear').onclick=()=>{if(!busy){$('files').value='';choose([]);$('status').textContent=''}};
const rational=n=>[Math.round(n*10000),10000],dms=n=>{n=Math.abs(n);let d=Math.floor(n),m=Math.floor((n-d)*60);return [[d,1],[m,1],rational((n-d-m/60)*3600)]};
const date=v=>v instanceof Date&&!isNaN(v)?v.getFullYear()+':'+String(v.getMonth()+1).padStart(2,'0')+':'+String(v.getDate()).padStart(2,'0')+' '+[v.getHours(),v.getMinutes(),v.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':'):typeof v==='string'?v:null;
function exifData(m){const a={Orientation:1},b={},g={};for(const k of ['Make','Model','Software'])if(typeof m[k]==='string')a[k]=m[k];for(const k of ['DateTimeOriginal','CreateDate']){let v=date(m[k]);if(v)b[k==='CreateDate'?'DateTimeDigitized':k]=v}for(const k of ['ExposureTime','FNumber','FocalLength'])if(Number.isFinite(m[k])&&m[k]>0)b[k]=rational(m[k]);if(Number.isInteger(m.ISO)&&m.ISO<=65535)b.ISOSpeedRatings=m.ISO;if(typeof m.LensModel==='string')b.LensModel=m.LensModel;if(Number.isFinite(m.latitude)&&Number.isFinite(m.longitude)){g.GPSLatitude=dms(m.latitude);g.GPSLatitudeRef=m.latitude<0?'S':'N';g.GPSLongitude=dms(m.longitude);g.GPSLongitudeRef=m.longitude<0?'W':'E'}if(Number.isFinite(m.GPSAltitude)){g.GPSAltitude=rational(Math.abs(m.GPSAltitude));g.GPSAltitudeRef=m.GPSAltitude<0?1:0}function tags(o,t){return Object.fromEntries(Object.entries(o).filter(([k])=>t[k]!==undefined).map(([k,v])=>[t[k],v]))}return {'0th':tags(a,piexif.ImageIFD),Exif:tags(b,piexif.ExifIFD),GPS:tags(g,piexif.GPSIFD),'1st':{},thumbnail:null}}
function dataurl(blob){return new Promise((r,j)=>{let f=new FileReader;f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(blob)})}
async function native(f,q){let u=URL.createObjectURL(f),im=new Image;try{im.src=u;await im.decode();let c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);try{return await new Promise((r,j)=>c.toBlob(b=>b?r(b):j(Error('JPEG生成失敗')),'image/jpeg',q))}finally{c.width=c.height=0}}finally{URL.revokeObjectURL(u)}}
async function convert(f,q,keep){let m={},note='Exif保持なし';if(keep){try{m=await exifr.parse(f,{gps:true,reviveValues:false})||{};note='元画像に確認できるExifなし'}catch(e){throw Error('Exif読み取り失敗: '+e.message)}}let b;try{b=await native(f,q)}catch(e){b=await heic2any({blob:f,toType:'image/jpeg',quality:q});if(Array.isArray(b))b=b[0]}if(keep&&Object.keys(m).length){let d=piexif.insert(piexif.dump(exifData(m)),await dataurl(b));let bytes=Uint8Array.from(atob(d.split(',')[1]),c=>c.charCodeAt(0));b=new Blob([bytes],{type:'image/jpeg'});let n=await exifr.parse(b,{gps:true,reviveValues:false})||{};let checks=[];for(const k of ['DateTimeOriginal','Make','Model'])if(m[k]!=null)checks.push([k,String(m[k])===String(n[k])]);for(const k of ['latitude','longitude'])if(Number.isFinite(m[k]))checks.push([k,Math.abs(m[k]-n[k])<0.00001]);note=checks.length?checks.map(([k,v])=>k+': '+(v?'一致':'不一致')).join(' / '):'主要Exifの照合対象なし'}return {b,note}}
$('go').onclick=async()=>{if(busy)return;busy=true;reset();$('go').disabled=$('clear').disabled=$('files').disabled=true;let q=+$('quality').value/100,keep=$('keep').checked,used=new Set();$('progress').max=files.length;for(let i=0;i<files.length;i++){let f=files[i],row=document.createElement('article');$('results').append(row);row.textContent=f.name+' — 変換中';$('status').textContent=(i+1)+' / '+files.length+' 枚';try{let {b,note}=await convert(f,q,keep),base=f.name.replace(/\.[^.]+$/,''),name=base+'.jpg',j=2;while(used.has(name.toLowerCase()))name=base+'_'+j+++'.jpg';used.add(name.toLowerCase());let url=URL.createObjectURL(b);outputs.push({name,b,url});row.replaceChildren();let img=new Image;img.src=url;img.alt='変換画像';let a=document.createElement('a');a.href=url;a.download=name;a.textContent=name+' 保存';let p=document.createElement('p');p.textContent=note;row.append(img,document.createTextNode(' '),a,p);if(navigator.canShare){let file=new File([b],name,{type:'image/jpeg'});if(navigator.canShare({files:[file]})){let share=document.createElement('button');share.textContent='共有・写真に保存';share.onclick=()=>navigator.share({files:[file]}).catch(()=>{});row.append(share)}}}catch(e){row.textContent=f.name+' — エラー: '+e.message}$('progress').value=i+1}$('status').textContent=outputs.length+' / '+files.length+' 枚 変換完了';busy=false;$('go').disabled=$('clear').disabled=$('files').disabled=false;$('zip').disabled=!outputs.length};
$('zip').onclick=async()=>{try{let z=new JSZip;for(const o of outputs)z.file(o.name,o.b);let u=URL.createObjectURL(await z.generateAsync({type:'blob'}));let a=document.createElement('a');a.href=u;a.download='converted-jpeg.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){$('status').textContent='ZIP失敗: '+e.message}};
</script></html>
